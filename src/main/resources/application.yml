server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tempdb}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-expiration-minutes: ${APP_JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${APP_JWT_REFRESH_EXPIRATION_DAYS:7}
  compactacion:
    enabled: ${COMPACTACION_ENABLED:false}
    cron: ${COMPACTACION_CRON:0 0 3 * * SUN}
    retencion-dias: ${COMPACTACION_RETENCION_DIAS:30}
    retencion-meses: ${COMPACTACION_RETENCION_MESES:12}
    max-lote: ${COMPACTACION_MAX_LOTE:100000}

logging:
  level:
    org.springframework.security: DEBUG
